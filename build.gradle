plugins { id 'fabric-loom' version '1.14.10' }
allprojects {
    group = 'dev.voidclient'
    version = '1.1.0'
    apply plugin: 'fabric-loom'
    repositories { mavenCentral() }
    dependencies {
        minecraft 'com.mojang:minecraft:1.21.11'
        mappings 'net.fabricmc:yarn:1.21.11+build.6:v2'
        modImplementation 'net.fabricmc:fabric-loader:0.20.1'
        modImplementation 'net.fabricmc.fabric-api:fabric-api:0.141.6+1.21.11'
    }
    java { toolchain.languageVersion = JavaLanguageVersion.of(21) }
    tasks.withType(JavaCompile).configureEach { options.encoding = 'UTF-8'; options.release = 21 }
}
project(':example-plugin') { dependencies { implementation project(path: ':', configuration: 'namedElements') } }

